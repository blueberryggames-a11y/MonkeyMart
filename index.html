  <!-- ============================================================
       SAVE FIX: Backs up Defold's IndexedDB saves to localStorage
       and restores them on load, so saves survive in Google Sites
       iframes where IndexedDB may be cleared between sessions.
       ============================================================ -->
  <script type="text/javascript">
    (function() {
      var SAVE_KEY = 'monkeymart_save_backup';
      var SAVE_INTERVAL_MS = 5000; // backup every 5 seconds while playing

      // Try to get IndexedDB reference safely (may be blocked in some iframes)
      function safeIndexedDB() {
        try { return window.indexedDB || window.mozIndexedDB || window.webkitIndexedDB; }
        catch(e) { return null; }
      }

      // Serialize all data from an IDBObjectStore into a plain object
      function dumpStore(db, storeName, callback) {
        try {
          var tx = db.transaction([storeName], 'readonly');
          var store = tx.objectStore(storeName);
          var result = {};
          var req = store.openCursor();
          req.onsuccess = function(e) {
            var cursor = e.target.result;
            if (cursor) {
              // Store value as base64 if it's binary, else as-is
              var val = cursor.value;
              if (val instanceof Uint8Array || val instanceof ArrayBuffer) {
                var arr = val instanceof ArrayBuffer ? new Uint8Array(val) : val;
                var binary = '';
                arr.forEach(function(b) { binary += String.fromCharCode(b); });
                result[cursor.key] = { type: 'binary', data: btoa(binary) };
              } else {
                result[cursor.key] = { type: 'raw', data: val };
              }
              cursor.continue();
            } else {
              callback(result);
            }
          };
          req.onerror = function() { callback(null); };
        } catch(e) { callback(null); }
      }

      // Write previously dumped data back into an IDBObjectStore
      function restoreStore(db, storeName, data, callback) {
        try {
          var tx = db.transaction([storeName], 'readwrite');
          var store = tx.objectStore(storeName);
          var keys = Object.keys(data);
          var i = 0;
          function next() {
            if (i >= keys.length) { callback(); return; }
            var key = keys[i++];
            var entry = data[key];
            var val;
            if (entry.type === 'binary') {
              var binary = atob(entry.data);
              var arr = new Uint8Array(binary.length);
              for (var j = 0; j < binary.length; j++) arr[j] = binary.charCodeAt(j);
              val = arr;
            } else {
              val = entry.data;
            }
            var req = store.put(val, key);
            req.onsuccess = next;
            req.onerror = next;
          }
          next();
          tx.oncomplete = function() { if(callback) callback(); };
        } catch(e) { if(callback) callback(); }
      }

      // Backup all stores in the /idbfs or Defold DB to localStorage
      function backupSave() {
        var idb = safeIndexedDB();
        if (!idb) return;
        // Defold uses a database named after the project or idbfs
        var dbNames = ['idbfs', 'MonkeyMart', '/idbfs'];
        dbNames.forEach(function(dbName) {
          try {
            var req = idb.open(dbName);
            req.onsuccess = function(e) {
              var db = e.target.result;
              var storeNames = Array.from(db.objectStoreNames);
              if (storeNames.length === 0) { db.close(); return; }
              var allData = {};
              var remaining = storeNames.length;
              storeNames.forEach(function(storeName) {
                dumpStore(db, storeName, function(data) {
                  if (data) allData[storeName] = data;
                  remaining--;
                  if (remaining === 0) {
                    try {
                      localStorage.setItem(SAVE_KEY + '_' + dbName, JSON.stringify(allData));
                      console.log('[SaveFix] Backed up save data for DB:', dbName);
                    } catch(e) {
                      console.warn('[SaveFix] Could not write to localStorage:', e);
                    }
                    db.close();
                  }
                });
              });
            };
            req.onerror = function() {};
          } catch(e) {}
        });
      }

      // Restore backed-up save data into IndexedDB before the game loads
      function restoreSave(callback) {
        var idb = safeIndexedDB();
        if (!idb) { callback(); return; }
        var dbNames = ['idbfs', 'MonkeyMart', '/idbfs'];
        var pending = dbNames.length;
        function done() { pending--; if (pending <= 0) callback(); }

        dbNames.forEach(function(dbName) {
          var raw;
          try { raw = localStorage.getItem(SAVE_KEY + '_' + dbName); } catch(e) {}
          if (!raw) { done(); return; }
          try {
            var allData = JSON.parse(raw);
            var storeNames = Object.keys(allData);
            if (storeNames.length === 0) { done(); return; }

            // Open/create the DB with all needed stores
            var openReq = idb.open(dbName, 1);
            openReq.onupgradeneeded = function(e) {
              var db = e.target.result;
              storeNames.forEach(function(storeName) {
                if (!db.objectStoreNames.contains(storeName)) {
                  db.createObjectStore(storeName);
                }
              });
            };
            openReq.onsuccess = function(e) {
              var db = e.target.result;
              var remaining = storeNames.length;
              storeNames.forEach(function(storeName) {
                if (!db.objectStoreNames.contains(storeName)) { 
                  remaining--; 
                  if (remaining === 0) { db.close(); done(); }
                  return; 
                }
                restoreStore(db, storeName, allData[storeName], function() {
                  remaining--;
                  if (remaining === 0) {
                    console.log('[SaveFix] Restored save data for DB:', dbName);
                    db.close();
                    done();
                  }
                });
              });
            };
            openReq.onerror = function() { done(); };
          } catch(e) { done(); }
        });
      }

      // Patch FS.syncfs to also backup whenever Defold syncs
      function patchFSSync() {
        if (typeof FS !== 'undefined' && FS.syncfs && !FS._saveFixPatched) {
          var original = FS.syncfs.bind(FS);
          FS.syncfs = function(populate, callback) {
            original(populate, function(err) {
              if (!populate) backupSave(); // only backup on write sync
              if (callback) callback(err);
            });
          };
          FS._saveFixPatched = true;
          console.log('[SaveFix] FS.syncfs patched.');
        }
      }

      // Poll until FS is available to patch it
      function waitForFS() {
        if (typeof FS !== 'undefined' && FS.syncfs) {
          patchFSSync();
        } else {
          setTimeout(waitForFS, 500);
        }
      }

      // Also do periodic backups as a safety net
      function startPeriodicBackup() {
        setInterval(backupSave, SAVE_INTERVAL_MS);
      }

      // Backup on page unload/hide too
      window.addEventListener('beforeunload', backupSave);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') backupSave();
      });

      // On load: restore first, then start the engine
      console.log('[SaveFix] Attempting to restore save data...');
      restoreSave(function() {
        console.log('[SaveFix] Restore complete. Starting backup watcher...');
        waitForFS();
        startPeriodicBackup();
      });

    })();
  </script>

  <script id="engine-start" type="text/javascript">
		var currentPercentage = 0

		Progress.updateProgress = function(percentage) {
			Progress.notifyListeners(percentage);
			if(currentPercentage>percentage){
				percentage = currentPercentage
			}
			currentPercentage = percentage
			var fg = document.getElementById('progress-bar-fg');
			fg.style.clip="rect(0px,"  + fg.width * percentage/100 + "px,"  + fg.height+"px," + "0px)"
			if(isNaN(percentage)){
				var progress_bar_root = document.getElementById('progress-bar-root');
				progress_bar_root.style.visibility = "hidden";
			}
		};
		Progress.addProgress = function (){
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "visible"
		}
		Progress.removeProgress = function () {
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "hidden";
			Module.canvas.style.background = "";
		}

		EngineLoader.stream_wasm = "false" === "true";
		EngineLoader.load("canvas", "MonkeyMart");
	</script>
